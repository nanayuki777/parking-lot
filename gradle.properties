# Project-wide Gradle settings.
#
# Required by the Android Gradle Plugin: this project depends on AndroidX
# (Jetpack Compose, Room, Navigation), so useAndroidX must be enabled.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# JVM args sized for this machine (2 cores / 8 GB RAM).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
